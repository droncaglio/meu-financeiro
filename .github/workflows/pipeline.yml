name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci-api:
    name: CI — API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install
        run: npm ci
        working-directory: api

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: api

      - name: Lint
        run: npm run lint
        working-directory: api

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: api

      - name: Test
        run: npm test
        working-directory: api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NODE_ENV: test

  ci-web:
    name: CI — Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web

  deploy:
    name: Deploy
    needs: [ci-api, ci-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/meu-financeiro-api:latest
            ghcr.io/${{ github.repository_owner }}/meu-financeiro-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/meu-financeiro-web:latest
            ghcr.io/${{ github.repository_owner }}/meu-financeiro-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          APP_PEPPER: ${{ secrets.APP_PEPPER }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          APP_URL: ${{ secrets.APP_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,IMAGE_TAG,ACTOR,OWNER,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,DATABASE_URL,JWT_SECRET,JWT_REFRESH_SECRET,APP_PEPPER,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM,APP_URL
          script: |
            set -e
            mkdir -p ~/meu-financeiro
            cd ~/meu-financeiro

            # Escreve .env a partir dos secrets do GitHub (substitui o arquivo inteiro)
            rm -f .env
            {
              printf 'POSTGRES_DB=%s\n'       "$POSTGRES_DB"
              printf 'POSTGRES_USER=%s\n'     "$POSTGRES_USER"
              printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
              printf 'DATABASE_URL=%s\n'      "$DATABASE_URL"
              printf 'JWT_SECRET=%s\n'        "$JWT_SECRET"
              printf 'JWT_REFRESH_SECRET=%s\n' "$JWT_REFRESH_SECRET"
              printf 'APP_PEPPER=%s\n'        "$APP_PEPPER"
              printf 'SMTP_HOST=%s\n'         "$SMTP_HOST"
              printf 'SMTP_PORT=%s\n'         "$SMTP_PORT"
              printf 'SMTP_USER=%s\n'         "$SMTP_USER"
              printf 'SMTP_PASS=%s\n'         "$SMTP_PASS"
              printf 'SMTP_FROM=%s\n'         "$SMTP_FROM"
              printf 'APP_URL=%s\n'          "$APP_URL"
              printf 'PORT=3000\n'
              printf 'NODE_ENV=production\n'
            } > .env
            chmod 600 .env

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            export GHCR_IMAGE_API=ghcr.io/$OWNER/meu-financeiro-api:$IMAGE_TAG
            export GHCR_IMAGE_WEB=ghcr.io/$OWNER/meu-financeiro-web:$IMAGE_TAG
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
